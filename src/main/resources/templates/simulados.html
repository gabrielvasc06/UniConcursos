<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniConcursos | Simulados</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
    <header class="navbar">
        <h1>UniConcursos</h1>
        <nav>
            <a th:href="@{/disciplinas}">Ciclo de Estudos</a>
            <a th:href="@{/simulados}" class="active">Simulados</a>
        </nav>
    </header>

    <main class="container">
        <section class="card">
            <h2>Registrar Novo Simulado</h2>
            <form th:action="@{/simulados/salvar}" th:object="${novoSimulado}" method="post" class="form-grid-simulado">
                <input type="text" th:field="*{titulo}" placeholder="Título (ex: Simulado Banca AOCP 01)" required>

                <select th:field="*{disciplina}" required>
                    <option value="">Selecione a Disciplina...</option>
                    <option th:each="d : ${disciplinas}" th:value="${d.id}" th:text="${d.nome}"></option>
                </select>

                <input type="date" th:field="*{dataRealizacao}" required>
                <input type="number" th:field="*{totalQuestoes}" placeholder="Total Questões" min="1" required>
                <input type="number" th:field="*{acertos}" placeholder="Acertos" min="0" required>
                <button type="submit" class="btn-primary">Salvar Resultado</button>
            </form>
        </section>

        <section class="card">
            <div class="header-row">
                <h2>Histórico de Desempenho</h2>
            </div>

            <p th:if="${#lists.isEmpty(simulados)}" class="empty-msg">
                Nenhum simulado registrado ainda. Cadastre o primeiro acima.
            </p>

            <table th:if="${!#lists.isEmpty(simulados)}">
                <thead>
                    <tr>
                        <th>Data</th>
                        <th>Título</th>
                        <th>Disciplina</th>
                        <th>Acertos / Total</th>
                        <th>Aproveitamento</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="simulado : ${simulados}">
                        <td th:text="${simulado.dataRealizacao}"></td>
                        <td th:text="${simulado.titulo}"></td>
                        <td th:text="${simulado.disciplina.nome}"></td>
                        <td th:text="${simulado.acertos} + ' / ' + ${simulado.totalQuestoes}"></td>
                        <td th:text="${simulado.percentualAcerto} + '%'"></td>
                        <td><a th:href="@{/simulados/excluir/{id}(id=${simulado.id})}">Excluir</a></td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>
</body>
</html>
